aid: ancient8
name: Ancient8
description: >-
  Ancient8 is a gaming-focused Ethereum Layer 2 blockchain built on the Optimism OP Stack with
  Celestia for data availability, designed to power Web3 gaming experiences at scale. The network is
  EVM-equivalent, so developers deploy Solidity smart contracts and dApps using standard tooling
  (Hardhat, Remix, thirdweb) against a public Ethereum JSON-RPC interface. Ancient8 Mainnet uses chain
  ID 888888888 with ETH as its gas currency, complemented by a Celestia-backed testnet, native and
  third-party bridges (Meson, Relay), block explorers (Routescan, Blockscout/A8Scan), a faucet,
  staking, and a vault. The programmable surface exposed to integrators is the JSON-RPC endpoint over
  HTTPS and WebSocket. Backed by Pantera Capital and surfaced into the API Evangelist network from its
  venture portfolio.
